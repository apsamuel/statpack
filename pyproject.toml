[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statpack"
version = "0.1.0"
description = "CLI-first statistical data gathering tool for US government data sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.5",
  "beautifulsoup4>=4.14.2",
  "pandas>=2.3.3",
  "geopandas>=1.1.1",
  "pydantic>=2.12.0",
  "click>=8.3.2",
  "libtmux>=0.46.2",
  "csvkit>=2.1.0",
  "tqdm>=4.67.1",
  "markitdown[all]>=0.1.5",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.5",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.14.0",
  "pytest-randomly>=3.16.0",
  "responses>=0.25.3",
]

[project.scripts]
statpack = "statpack.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
skip-magic-trailing-comma = true
line-length = 120
target-version = ['py311']
